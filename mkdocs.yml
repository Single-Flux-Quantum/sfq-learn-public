site_name: SFQ Learning
site_url: https://single-flux-quantum.github.io/sfq-learn-public/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - admonition
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Fundamentals:
      - Flux Quantization: fundamentals/flux-quantization.md
  - Bridge:
      - Phase to Pulse: bridge/phase-to-pulse.md
  - Concepts:
      - RSFQ Logic: concepts/rsfq-logic.md
  - Tracks:
      - SFQ Logic Primitives: tracks/sfq-logic-primitives/ROADMAP.md
